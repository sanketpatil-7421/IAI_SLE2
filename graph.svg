<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">BFS and DFS Graph Traversal</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial" font-size="17">Graph used for SLE-2 — Start vertex: A</text>

<!-- edges -->
<g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
 <line x1="600" y1="140" x2="350" y2="250"/><line x1="600" y1="140" x2="850" y2="250"/>
 <line x1="350" y1="250" x2="220" y2="390"/><line x1="350" y1="250" x2="480" y2="390"/>
 <line x1="850" y1="250" x2="720" y2="390"/><line x1="850" y1="250" x2="980" y2="390"/>
</g>

<!-- BFS path -->
<g stroke="#e67e22" stroke-width="7" fill="none" opacity="0.9">
 <line x1="600" y1="140" x2="350" y2="250"/><line x1="350" y1="250" x2="220" y2="390"/>
</g>

<!-- nodes -->
<g font-family="Arial" font-size="24" text-anchor="middle">
 <circle cx="600" cy="140" r="42" fill="#ffd166" stroke="#333" stroke-width="4"/><text x="600" y="148">A</text>
 <circle cx="350" cy="250" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="350" y="258">B</text>
 <circle cx="850" cy="250" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="850" y="258">C</text>
 <circle cx="220" cy="390" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="220" y="398">D</text>
 <circle cx="480" cy="390" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="480" y="398">E</text>
 <circle cx="720" cy="390" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="720" y="398">F</text>
 <circle cx="980" cy="390" r="42" fill="#f4f4f4" stroke="#333" stroke-width="4"/><text x="980" y="398">G</text>
</g>

<!-- legend -->
<line x1="100" y1="520" x2="170" y2="520" stroke="#e67e22" stroke-width="7"/>
<text x="185" y="527" font-family="Arial" font-size="19">BFS traversal path</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Adjacency: A→B,C | B→D,E | C→F,G</text>
<text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="19">BFS: A → B → C → D → E → F → G</text>
<text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="19">DFS: A → B → D → E → C → F → G</text>
<text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="16">SLE-2 | Sanket Subhash Patil | Python</text>
</svg>
